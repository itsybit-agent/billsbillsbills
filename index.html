<!DOCTYPE html>
<html lang="en" data-skin="kvitto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BillsBillsBills</title>
  <script>
    // Apply the saved look before first paint
    try {
      const look = JSON.parse(localStorage.getItem('billsbillsbills_look') || '{}');
      if (look.skin) document.documentElement.dataset.skin = look.skin;
      if (look.theme) document.documentElement.dataset.theme = look.theme;
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=Martian+Mono:wght@400;600&family=Bagel+Fat+One&family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&family=Hanken+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="bar" id="bar"></header>
    <main class="screen" id="screen" aria-live="polite"></main>
  </div>
  <div id="overlay"></div>

  <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
  <input type="file" id="importRulesInput" accept=".json" hidden>
  <input type="file" id="importEventsInput" accept=".json" hidden>

  <!-- Debug Console (hidden unless ?debug in URL) -->
  <div id="debugConsole" class="debug-console" style="display: none;">
    <input type="text" id="debugInput" class="debug-input" placeholder="/clear, /rules, /events, /help">
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
